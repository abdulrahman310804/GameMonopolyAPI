*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#642458,transparent 30%),radial-gradient(circle at 85% 20%,#155271,transparent 30%),linear-gradient(145deg,#080b19,#11182b 55%,#080c18);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}.orb{position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(80px);opacity:.25;pointer-events:none}.a{background:#ff4e9c;left:-100px;top:30%}.b{background:#42e5d0;right:-110px;bottom:5%}.wrap{width:min(900px,94%);margin:auto;padding:20px 0}.back{color:#8ef3df;text-decoration:none;font-weight:800;font-size:13px}.head{text-align:center;padding:18px 0}.eyebrow{font-size:10px;letter-spacing:4px;color:#79ead8;font-weight:900}.head h1{font-size:clamp(42px,8vw,70px);margin:7px 0;background:linear-gradient(90deg,#fff,#ffb5d9,#8df6e4);-webkit-background-clip:text;color:transparent}.head p{color:#9caec5;margin:0}.table{height:510px;position:relative;display:grid;place-items:center;perspective:1300px}.deck{position:absolute;width:min(680px,92%);height:390px}.mini{position:absolute;inset:0;margin:auto;width:90%;height:90%;border-radius:30px;border:1px solid #fff2;background:linear-gradient(145deg,#1c3150,#111d34);box-shadow:0 25px 60px #0008;transform:rotate(-5deg) translate(-15px,10px)}.mini.two{transform:rotate(5deg) translate(15px,4px);background:linear-gradient(145deg,#263153,#111d31)}.card{position:relative;z-index:2;width:min(680px,92%);min-height:390px;border:1px solid #ffffff25;border-radius:32px;background:linear-gradient(145deg,#1a2944f2,#10182cf5);box-shadow:0 30px 90px #000b,0 0 55px #ff5caa18;padding:35px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden}.card:before{content:'?';position:absolute;font-size:300px;font-weight:1000;color:#fff0004;right:-35px;bottom:-120px}.shine{position:absolute;width:190px;height:190px;border-radius:50%;background:#ff77b51a;filter:blur(30px);top:-90px;right:-70px 'Tatap pasangan selama 30 detik tanpa tertawa.','Sebutkan 3 hal yang kamu suka dari orang di sebelahmu.','Buat gombalan spontan dalam 15 detik.','Tirukan gaya bicara pasangan atau teman selama 20 detik.','Kirim atau ucapkan voice note berisi kalimat manis.','Sebutkan 5 alasan kamu bersyukur punya orang tersayang.','Buat panggilan baru yang lucu untuk pasangan.','Nyanyikan bagian lagu yang mengingatkanmu pada seseorang.','Ceritakan kenangan favorit seperti pembawa berita.','Berikan pujian yang belum pernah kamu berikan sebelumnya.','Buat pantun romantis spontan.','Tulis satu kalimat tentang masa depan yang kamu inginkan.','Tiru ekspresi seseorang saat sedang kesal.','Buat pesan seolah-olah kalian baru pertama kali bertemu.','Pegang tangan pasangan selama 20 detik jika sama-sama nyaman.','Buat slogan hubungan atau persahabatan kalian.','Sebutkan 3 hal yang ingin kamu lakukan bersama orang tersayang.','Buat cerita mini tentang kencan impianmu.','Sebutkan satu lagu yang cocok untuk hubungan kalian dan alasannya.','Berikan satu kalimat apresiasi yang benar-benar tulus.','Buat gombalan tanpa menggunakan kata sayang.','Tatap mata pemain lain lalu katakan satu kalimat positif.','Buat puisi 4 baris tentang orang di sebelahmu.','Nyanyikan chorus lagu romantis dengan gaya dramatis.','Buat pose foto paling aesthetic.','Sebutkan 5 alasan seseorang di ruangan ini menarik.','Buat pesan good night paling manis dalam 20 detik.','Ceritakan kencan impian seperti sedang menjual paket wisata.','Buat satu janji kecil yang realistis untuk dirimu sendiri.','Tirukan cara seseorang memanggil namamu.','Buat nama restoran fiktif milikmu dan pasangan.','Buat slogan brand pasangan atau sahabatmu.','Buat pantun cinta spontan.','Pilih satu emoji yang menggambarkan pasanganmu dan jelaskan.','Buat dialog film romantis selama 20 detik.','Sebutkan satu kebiasaan seseorang yang ingin kamu pertahankan.','Katakan satu pesan penyemangat kepada orang di dekatmu.','Tirukan salah satu teman dan biarkan pemai const all=[...T.map(x=>({mode:'truth',text:x})),...D.map(x=>({mode:'dare',text:x}))];
document.getElementById('total').textContent=all.length;
function draw(force){const table=document.getElementById('table'),card=document.getElementById('card');if(table.classList.contains('shuffle'))return;table.classList.remove('reveal','pop');void table.offsetWidth;table.classList.add('shuffle');document.getElementById('type').textContent='🎴 MENGOCOK KARTU...';document.getElementById('question').textContent='Kartu sedang diacak...';document.getElementById('sub').textContent='Jangan intip dulu 👀';setTimeout(()=>{let pool=force?all.filter(x=>x.mode===force):all,item;do{item=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&item.text===lastText);lastText=item.text;lastMode=item.mode;round++;document.getElementById('type').textContent=item.mode==='truth'?'💬 TRUTH':'🔥 DARE';document.getElementById('question').textContent=item.text;document.getElementById('sub').textContent='Kartu '+round+' • Semua kategori tercampur secara acak';document.getElementById('count').textContent=round;table.classList.remove('shuffle');void table.offsetWidth;table.classList.add('reveal','pop')},900)}
