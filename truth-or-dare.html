<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truth or Dare • Nusantara Game Center</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#071522;color:#eefcff;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center}body:before{content:'';position:fixed;inset:-20%;background:radial-gradient(circle at 20% 20%,#4a1d4d 0,transparent 28%),radial-gradient(circle at 80% 15%,#16445c 0,transparent 30%),radial-gradient(circle at 50% 100%,#123f45 0,transparent 35%);z-index:-1}.wrap{width:min(900px,100%)}.back{color:#70e8d8;text-decoration:none;font-weight:800;font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#70e8d8;font-weight:800;margin-top:26px}h1{font-size:clamp(34px,7vw,60px);margin:7px 0}.desc{color:#9db7c1;line-height:1.6}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.chip,button{border:1px solid #ffffff18;background:#102333;color:#eefcff;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer}.chip.active{background:#65e7d01f;border-color:#65e7d0;color:#65e7d0}.card{min-height:330px;border:1px solid #ffffff18;border-radius:28px;background:#102333e8;box-shadow:0 20px 60px #0007;padding:32px;display:flex;flex-direction:column;justify-content:center;text-align:center}.type{font-size:12px;letter-spacing:3px;font-weight:900}.question{font-size:clamp(24px,5vw,40px);line-height:1.25;margin:25px auto;max-width:760px}.category{color:#9db7c1;font-size:13px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}button{font-size:15px;padding:14px 22px}button.truth{background:#246b67}button.dare{background:#7b3d62}button.next{background:#65e7d0;color:#06161d}.stats{display:flex;justify-content:center;gap:18px;color:#809aa5;font-size:12px;margin-top:16px}@media(max-width:600px){.card{min-height:380px;padding:22px}.controls{gap:7px}.chip{font-size:11px;padding:10px 11px}}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="index.html">← Kembali ke game</a>
<div class="eyebrow">NUSANTARA GAME CENTER</div>
<h1>💗 Truth or Dare</h1>
<p class="desc">Game untuk dimainkan berdua atau bersama teman. Pilih kategori, pilih Truth atau Dare, lalu lanjutkan ke tantangan berikutnya.</p>
<div class="controls" id="categories"></div>
<section class="card">
<div class="type" id="type">TRUTH</div>
<div class="question" id="question">Tekan Truth atau Dare untuk memulai.</div>
<div class="category" id="category">Kategori: Semua</div>
<div class="actions"><button class="truth" onclick="draw('truth')">💬 TRUTH</button><button class="dare" onclick="draw('dare')">🔥 DARE</button><button class="next" onclick="draw()">🎲 ACAK</button></div>
</section>
<div class="stats"><span id="count">Pertanyaan: 0</span><span>•</span><span>Boleh skip kapan saja ❤️</span></div>
</main>
<script>
const data={
'Pacar':{truth:[
'Hal kecil apa dariku yang paling kamu suka tetapi jarang kamu bilang?','Kapan pertama kali kamu merasa nyaman banget sama aku?','Apa momen kita yang paling ingin kamu ulang?','Apa kebiasaan aku yang diam-diam bikin kamu gemas?','Apa hal yang paling kamu takutkan terjadi dalam hubungan kita?','Kalau bisa mengubah satu hal dari cara kita pacaran, apa itu?','Apa panggilan dariku yang paling kamu suka?','Apa bentuk perhatian dariku yang paling kamu ingat?','Apa hal yang membuatmu merasa paling disayang?','Apa impian sederhana yang ingin kamu lakukan bareng aku?','Apa sifatku yang menurutmu paling cocok denganmu?','Apa hal yang pernah ingin kamu ceritakan kepadaku tetapi belum sempat?','Apa momen paling lucu yang pernah kita alami?','Kalau kita punya satu hari tanpa internet, kamu mau melakukan apa denganku?','Apa hal romantis yang ingin kamu coba bersamaku?','Apa yang membuatmu yakin untuk tetap bertahan saat kita sedang berbeda pendapat?','Apa hal yang ingin kamu perbaiki dalam komunikasi kita?','Apa satu kenangan kita yang tidak ingin kamu lupakan?','Apa hal paling random yang pernah membuatmu kangen aku?','Kalau hubungan kita dibuat film, apa judulnya?'],dare:[
'Kirim foto selfie paling lucu yang bisa kamu buat sekarang.','Tatap pasangan selama 30 detik tanpa tertawa.','Ucapkan 3 hal yang kamu suka dari pasangan dengan serius.','Buat gombalan spontan dalam 15 detik.','Tirukan gaya bicara pasangan selama 30 detik.','Kirim voice note berisi kalimat manis pilihanmu.','Sebutkan 5 alasan kamu bersyukur punya pasangan.','Buat nama panggilan baru yang lucu untuk pasangan.','Nyanyikan bagian lagu yang mengingatkanmu pada pasangan.','Ceritakan satu kenangan favorit kalian dengan gaya seperti pembawa berita.','Berikan pujian yang belum pernah kamu berikan sebelumnya.','Buat pantun romantis untuk pasangan.','Tulis satu kalimat tentang masa depan yang ingin kalian capai bersama.','Tiru ekspresi pasangan saat sedang kesal.','Buat pesan singkat seolah-olah kalian baru pertama kali bertemu.']},
'Teman':{truth:['Siapa teman yang paling sering membuatmu tertawa?','Apa kebiasaan temanmu yang paling mengganggu tetapi tetap kamu maklumi?','Pernahkah kamu salah paham dengan teman sendiri?','Apa kenangan sekolah atau kuliah paling lucu bersama teman?','Apa rahasia kecil yang aman untuk diceritakan di sini?','Siapa teman yang paling mungkin kamu hubungi saat sedang punya masalah?','Apa sifat teman yang paling kamu hargai?','Pernahkah kamu pura-pura setuju dengan teman padahal sebenarnya tidak?','Apa hal paling konyol yang pernah kamu lakukan bersama teman?','Kalau bisa mengulang satu hari bersama teman, hari apa?','Apa tipe teman yang paling sulit kamu hadapi?','Pernahkah kamu merasa cemburu terhadap teman?','Apa kesalahpahaman paling lucu yang pernah terjadi di pertemananmu?','Siapa yang paling jago menyimpan rahasia menurutmu?','Apa hal yang ingin kamu katakan kepada teman-temanmu lebih sering?'],dare:['Tirukan salah satu temanmu tanpa menyebut namanya dan biarkan yang lain menebak.','Kirim emoji yang paling menggambarkan salah satu temanmu.','Buat julukan lucu untuk orang di sebelahmu.','Ceritakan kejadian paling memalukan bersama teman dengan ekspresi serius.','Buat ranking 3 makanan yang paling cocok dimakan saat nongkrong.','Buat pantun tentang pertemanan.','Telepon teman dan tanyakan pertanyaan random yang sopan.','Tirukan gaya chat salah satu temanmu selama 20 detik.','Sebutkan 3 kualitas baik dari teman di sebelahmu.','Buat slogan persahabatan selama 10 detik.']},
'Keluarga':{truth:['Siapa anggota keluarga yang paling sering membuatmu tertawa?','Apa tradisi keluarga yang paling kamu suka?','Apa kenangan masa kecil bersama keluarga yang paling kamu ingat?','Siapa yang paling sering kamu mintai nasihat?','Apa makanan keluarga yang paling kamu rindukan?','Pernahkah kamu menyembunyikan sesuatu yang sepele dari keluarga karena takut dimarahi?','Apa pelajaran terbesar yang kamu dapat dari keluarga?','Apa kegiatan keluarga yang ingin kamu lakukan lebih sering?','Siapa anggota keluarga yang paling mirip denganmu?','Apa momen keluarga yang paling membuatmu merasa bersyukur?','Apa kebiasaan keluarga yang menurutmu unik?','Apa hal yang ingin kamu lakukan untuk membuat keluarga bangga?'],dare:['Ucapkan terima kasih kepada anggota keluarga yang kamu pilih.','Ceritakan satu kenangan keluarga dengan gaya dramatis.','Buat ucapan ulang tahun palsu untuk anggota keluarga dengan gaya presenter.','Sebutkan 5 makanan favorit keluarga.','Tirukan ekspresi salah satu anggota keluarga saat kaget.','Kirim pesan sederhana kepada keluarga: “Semoga hari ini menyenangkan.”','Ceritakan satu kejadian lucu saat kumpul keluarga.','Buat pantun tentang keluarga.']},
'Sahabat':{truth:['Apa hal yang paling kamu percaya dari sahabatmu?','Apa momen ketika sahabatmu paling membantumu?','Pernahkah kamu kecewa kepada sahabat tetapi memilih diam?','Apa hal yang membuat persahabatan kalian bertahan?','Apa sifat sahabat yang paling ingin kamu miliki?','Kalau sahabatmu pindah jauh, apa yang paling kamu rindukan?','Apa pengalaman paling absurd yang pernah kalian lakukan bersama?','Apa hal yang tidak boleh dilakukan dalam persahabatan menurutmu?','Apa satu janji persahabatan yang ingin kamu pertahankan?','Apa kenangan sahabat yang paling membuatmu tersenyum?'],dare:['Buat voice note 20 detik berisi apresiasi untuk sahabatmu.','Tirukan sahabatmu saat sedang marah.','Buat foto berdua dengan pose paling absurd.','Sebutkan 5 hal yang membuat sahabatmu spesial.','Buat nama duo kalian seperti nama grup musik.','Ceritakan kisah pertemanan kalian dalam 3 kalimat.','Buat pantun khusus untuk sahabat.']},
'Mantan':{truth:['Apa pelajaran terbesar yang kamu dapat dari hubungan masa lalu?','Apa kebiasaan dari hubungan masa lalu yang tidak ingin kamu ulangi?','Pernahkah kamu menyesali cara mengakhiri hubungan?','Apa hal baik yang masih kamu hargai dari mantan?','Apa yang sekarang kamu pahami tentang dirimu setelah hubungan itu?','Apa red flag yang dulu kamu abaikan?','Apa green flag yang sekarang lebih kamu hargai?','Apa hal yang paling membuatmu berubah setelah putus?','Kalau bisa memberi nasihat kepada dirimu di awal hubungan itu, apa yang kamu katakan?','Apa kenangan lucu dari masa lalu yang sekarang bisa kamu tertawakan?'],dare:['Ceritakan satu pelajaran dari masa lalu tanpa menyebut nama siapa pun.','Buat kalimat penutup hubungan yang dewasa dan damai.','Sebutkan 3 hal yang sekarang kamu cari dalam hubungan sehat.','Buat meme verbal tentang pengalaman gagal move on tanpa menyebut orang.','Tirukan adegan drama putus cinta selama 20 detik.','Buat satu kalimat “aku sudah belajar bahwa...”']},
'Lucu':{truth:['Apa kebohongan paling konyol yang pernah kamu ucapkan?','Pernah salah kirim chat? Ceritakan situasinya.','Apa kejadian paling memalukan yang sekarang terasa lucu?','Pernah jatuh atau tersandung di depan banyak orang?','Apa makanan aneh yang ternyata pernah kamu suka?','Pernah salah panggil nama orang?','Apa kebiasaan aneh yang kamu lakukan saat sendirian?','Apa pencarian internet paling random yang pernah kamu lakukan?','Pernah tertawa di situasi yang seharusnya serius?','Apa alasan paling absurd yang pernah kamu gunakan untuk menunda sesuatu?'],dare:['Bicara seperti robot selama 30 detik.','Tirukan suara hewan yang dipilih pemain lain.','Jalan seperti model catwalk selama 15 detik.','Buat wajah paling aneh selama 10 detik.','Nyanyikan lagu anak-anak dengan gaya penyanyi opera.','Buat iklan untuk benda terdekat selama 20 detik.','Bicara tanpa menggunakan kata “aku” selama 30 detik.','Tirukan karakter film yang kamu tahu.','Buat tarian 10 detik tanpa musik.','Ceritakan lelucon paling receh yang kamu tahu.']},
'Trauma & Deep':{truth:['Apa pengalaman sulit yang membuatmu menjadi lebih kuat?','Apa hal yang sekarang ingin kamu maafkan dari dirimu sendiri?','Kapan terakhir kali kamu merasa benar-benar didengarkan?','Apa ketakutan yang sedang kamu coba hadapi?','Apa hal yang dulu sangat penting bagimu tetapi sekarang tidak?','Apa batasan pribadi yang sekarang ingin kamu jaga?','Apa nasihat yang ingin kamu dengar ketika sedang berada di titik terendah?','Apa hal yang paling kamu syukuri setelah melewati masa sulit?','Apa bagian dari dirimu yang ingin lebih kamu hargai?','Apa satu hal yang ingin kamu lepaskan agar hidup terasa lebih ringan?','Apa bentuk dukungan yang paling kamu butuhkan ketika sedang sedih?','Apa hal yang membuatmu merasa aman bersama seseorang?'],dare:['Ceritakan sesuatu yang membuatmu bangga telah berhasil melewatinya, tanpa detail yang tidak ingin kamu bagikan.','Sebutkan 3 hal kecil yang membuat hidupmu terasa lebih baik.','Tulis satu kalimat penyemangat untuk dirimu di masa lalu.','Tarik napas dalam-dalam 3 kali lalu sebutkan satu hal yang kamu syukuri.','Katakan kepada orang di dekatmu satu apresiasi yang tulus.','Buat janji kecil yang realistis untuk menjaga dirimu minggu ini.']},
'Masa Depan':{truth:['Di mana kamu ingin melihat dirimu 5 tahun lagi?','Apa impian yang paling ingin kamu wujudkan?','Apa skill yang ingin kamu kuasai?','Apa tempat yang ingin kamu kunjungi bersama orang tersayang?','Apa pekerjaan atau proyek impianmu?','Apa gaya hidup yang ingin kamu bangun?','Apa hal yang ingin kamu capai sebelum usia tertentu?','Kalau uang bukan masalah, kegiatan apa yang ingin kamu lakukan?','Apa satu kebiasaan yang ingin kamu mulai?','Apa arti sukses menurutmu saat ini?'],dare:['Buat rencana 3 langkah untuk satu impianmu.','Sebutkan 5 tempat yang ingin kamu kunjungi.','Ceritakan versi dirimu 5 tahun lagi selama 30 detik.','Buat motto hidup untuk masa depanmu.','Sebutkan satu skill yang akan kamu mulai pelajari.','Tulis satu target yang ingin kamu capai bulan ini.']},
'Random':{truth:['Apa hal pertama yang kamu lakukan setelah bangun tidur?','Kalau bisa punya satu superpower, apa pilihanmu?','Apa makanan yang tidak akan pernah kamu bosan makan?','Siapa orang yang paling sering membuatmu tersenyum?','Apa aplikasi yang paling sering kamu buka?','Kalau hidupmu punya soundtrack, lagu apa yang cocok?','Apa barang yang selalu kamu bawa?','Apa hal sederhana yang langsung memperbaiki mood-mu?','Kalau bisa bertukar hidup dengan siapa pun sehari, siapa?','Apa keputusan spontan paling seru yang pernah kamu buat?'],dare:['Pilih satu emoji dan jelaskan kenapa itu menggambarkanmu.','Buat suara notifikasi HP dengan mulut.','Sebutkan alfabet secepat yang kamu bisa.','Buat slogan untuk dirimu sendiri.','Pose seperti patung selama 15 detik.','Tunjukkan ekspresi kaget terbaikmu.','Buat cerita 3 kalimat dari tiga benda di dekatmu.','Bicara dengan aksen pilihanmu selama 20 detik.']}
};
let selected='Random',round=0;
const cat=document.getElementById('categories');
Object.keys(data).forEach(k=>{const b=document.createElement('button');b.className='chip'+(k==='Random'?' active':'');b.textContent=k;b.onclick=()=>{selected=k;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('question').textContent='Siap? Pilih Truth, Dare, atau Acak.';document.getElementById('category').textContent='Kategori: '+k};cat.appendChild(b)});
function draw(type){let pool=data[selected];let mode=type||(Math.random()<.5?'truth':'dare');let list=pool[mode];let item=list[Math.floor(Math.random()*list.length)];round++;document.getElementById('type').textContent=mode==='truth'?'💬 TRUTH':'🔥 DARE';document.getElementById('question').textContent=item;document.getElementById('category').textContent='Kategori: '+selected;document.getElementById('count').textContent='Pertanyaan dimainkan: '+round}
</script>
</body>
</html>
