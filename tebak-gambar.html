<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tebak Gambar • Nusantara Game Center</title><style>:root{--bg:#071522;--panel:#102333;--line:#ffffff18;--teal:#65e7d0;--text:#eefcff;--muted:#9db7c1;--gold:#ffd478}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#16445c,transparent 28%),radial-gradient(circle at 85% 20%,#31265f,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);background:#071522dd;position:sticky;top:0;z-index:5}.back{color:var(--teal);text-decoration:none;font-weight:800}.title{display:flex;align-items:center;gap:10px}.title strong{font-size:15px}.level-label{font-size:10px;color:var(--muted);letter-spacing:1px}main{width:min(900px,calc(100% - 32px));margin:28px auto}.scorebar{display:flex;justify-content:space-between;gap:10px;margin-bottom:18px}.scorebox{flex:1;padding:14px;border:1px solid var(--line);border-radius:14px;background:#102333cc;text-align:center}.scorebox span{display:block;color:var(--muted);font-size:11px}.scorebox strong{display:block;color:var(--gold);font-size:24px}.card{padding:28px;border:1px solid var(--line);border-radius:24px;background:#102333e8;box-shadow:0 20px 50px #0006;text-align:center}.round{color:var(--teal);font-size:11px;letter-spacing:2px;font-weight:900}.picture{font-size:clamp(58px,12vw,110px);padding:28px 10px;letter-spacing:10px;min-height:150px;display:grid;place-items:center}.question{color:var(--muted);margin-bottom:18px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:620px;margin:auto}.answers button{border:1px solid #ffffff22;border-radius:12px;padding:14px;background:#172d3d;color:var(--text);font-weight:800;cursor:pointer}.answers button:hover{border-color:var(--teal);transform:translat </style></head><body><header><a class="back" href="games.html?game=tebak-gambar">← Pilih Level</a><div class="title"><span>🖼️</span><strong>TEBAK GAMBAR</strong></div><div class="level-label" id="levelLabel"></div></header><main><section class="scorebar"><div class="scorebox"><span>LEVEL</span><strong id="levelValue">1</strong></div><div class="scorebox"><span>SKOR</span><strong id="scoreValue">0</strong></div><div class="scorebox"><span>SOAL</span><strong id="questionValue">1/10</strong></div></section><section class="card"><div class="round" id="round"></div><div class="picture" id="picture"></div><div class="question">Pilih jawaban yang paling sesuai dengan gambar.</div><div class="answers" id="answers"></div><div class="message" id="message" aria-live="polite"></div><div class="actions"><button id="nextBtn" class="primary hidden">Soal Berikutnya →</button><button id="restartBtn">Mulai Ulang</button></div></section></main><script src="js/defeat.js"></script><script>const level=Math.min(6,Math.max(1,parseInt(new URLSearchParams(location.search).get('level'))||1));const banks=[['🌧️ + ☂️|Payung|Payung,Pelangi,Hujan,Jas Hujan','🌞 + 🌻|Bunga Matahari|Bunga Mawar,Matahari Terbit,Bunga Matahari,Bunga Teratai','📚 + 🏫|Sekolah|Perpustakaan,Sekolah,Kampus,Kantor','🌊 + 🏝️|Pantai|Gunung,Pantai,Danau,Sungai','🚲 + 🛣️|Bersepeda|Berkendara,Bersepeda,Berjalan,Balapan','🔥 + 🐟|Ikan Bakar|Ikan Asap,Ikan Bakar,Ikan Goreng,Ikan Api','🍚 + 🐔|Nasi Ayam|Nasi Goreng,Ayam Bakar,Nasi Ayam,Bubur Ayam','👑 + 🦁|Raja Hutan|Raja Hutan,Singa Laut,Kepala Negara,Hewan Buas','🌙 + ⭐|Malam|Pagi,Siang,Malam,Senja','🏠 + 🔥|Kebakaran|Rumah Baru,Kebakaran,Api Unggun,Dapur'],['⭐ + 🐟|Bintang Laut|Ikan Mas,Bintang Laut,Ikan Terbang,Bintang Ikan','🍎 + 📱|Apple|Android,Apple,Samsung,Nokia','🚗 + 🏠|Garasi|Garasi,Terminal,Parkiran,Bengkel','☀️ + 👓|Kacamata Hitam|Kacamata Hitam,Matahari,Kaca Pembesar,Topi','🐝 + 🍯|Madu|Lebah,Madu,Gula,Manisan','🚀 + 🌙|Bulan|Pesawat,Bulan,Roket,Astronaut','🧊 + 🍵|Es Teh|Teh Panas,Es Teh,Jus n Terbang,Bintang Ikan','🚀 + 🌙|Bulan|Pesawat,Bulan,Roket,Astronaut','🎂 + 🎉|Ulang Tahun|Pernikahan,Ulang Tahun,Wisuda,Liburan','🌧️ + 🌈|Pelangi|Hujan,Pelangi,Awan,Petir','🐝 + 🍯|Madu|Lebah,Madu,Gula,Manisan','☀️ + 👓|Kacamata Hitam|Kacamata Hitam,Matahari,Kaca Pembesar,Topi','🔥 + 🐟|Ikan Bakar|Ikan Asap,Ikan Bakar,Ikan Goreng,Ikan Api','🏠 + 🔥|Kebakaran|Rumah Baru,Kebakaran,Api Unggun,Dapur']];const questions=banks[level-1].map(s=>{const [pic,answer,opts]=s.split('|');return{pic,answer,options:opts.split(',')}});let q=0,score=0,locked=false,wrong=0;const $=id=>document.getElementById(id);$('levelLabel').textContent='LEVEL '+level;$('levelValue').textContent=level;function init(){q=0;score=0;wrong=0;locked=false;$('scoreValue').textContent=0;render()}function render(){locked=false;$('round').textContent='LEVEL '+level+' • SOAL '+(q+1)+' / '+questions.length;$('questionValue').textContent=(q+1)+'/'+questions.length;$('picture').textContent=questions[q].pic;$('message').textContent='';$('nextBtn').classList.add('hidden');$('answers').innerHTML=questions[q].options.map((x,i)=>'<button type="button" data-answer="'+x.replace(/"/g,'&quot;')+'">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('');$('answers').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.answer))}function answer(value){if(locked)return;locked=true;if(value===questions[q].answer){score+=10;$('message').textContent='✅ Benar! +10 poin.'}else{wrong++;$('message').textContent='❌ Belum tepat. Jawaban: '+questions[q].answer;if(wrong>=3){showCatDefeat('Tiga jawaban salah di level ini. Kucingnya sampai ngakak 😹');locked=true;return}}$('scoreValue').textContent=score;$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);$('nextBtn').classList.remove('hidden')}function next(){if(!locked)return;if(q===questions.length-1){$('round').textContent='LEVEL '+level+' SELESAI';$('picture').textContent='🏆';$('answers').innerHTML='';$('message').textContent='Skor kamu: '+score+' poin';$('nextBtn').textContent='Main Lagi';$('nextBtn').onclick=init;return}q++;render()}$('nextBtn').addEventListener('click',next);$('restartBtn').addEventListener('click',init);init();</script></body></html>
