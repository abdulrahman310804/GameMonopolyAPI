<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Battle - Nusantara Game Center</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#071522;color:#eefcff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}.wrap{width:min(620px,100%);text-align:center}.back{color:#70e8d8;text-decoration:none;font-weight:800;font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#70e8d8;font-weight:800;margin-top:22px}h1{font-size:clamp(30px,7vw,52px);margin:8px 0}.desc{color:#9db7c1;line-height:1.6}.panel{margin-top:24px;padding:24px;border:1px solid #ffffff18;border-radius:24px;background:#102333e8;box-shadow:0 18px 45px #0005}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat{padding:12px;border-radius:14px;background:#ffffff08}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:#9db7c1}.question{font-size:42px;font-weight:1000;margin:22px 0}.answer{width:100%;padding:15px;border-radius:14px;border:1px solid #ffffff20;background:#071522;color:#fff;font-size:24px;text-align:center;outline:none}.btn{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:#65e7d0;color:#071522;font-weight:1000;cursor:pointer}.feedback{min-height:24px;margin-top:12px;font-weight:800}.start{display:flex;gap:10px}.start select{flex:1;padding:13px;border-radius:12px;background:#071522;color:#fff;border:1px solid #ffffff20}.hidden{display:none}.result h2{font-size:28px}.result strong{font-size:44px}.small{color:#9db7c1;font-size:12px}@media(max-width:500px){.panel{padding:18px}.question{font-size:36px}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><a class="back" href="games.html?game=math">← Pilih Level</a><div class="eyebrow">NUSANTARA GAME CENTER</div><h1>🧮 Math Battle</h1><p class="desc">Jawab 10 soal matematika. Salah 3 kali berarti kalah.</p><section class="panel" id="setup"><h2>Pilih Level</h2><div class="start"><select id="level"><option value="1">Level 1 · Pemula</option><option value="2">Level 2 · Mudah</option><option value="3">Level 3 · Menengah</option><option value="4">Level 4 · Sulit</option><option value="5">Level 5 · Ahli</option><option value="6">Level 6 · Master</option></select><button class="btn" id="startBtn">MULAI</button></div></section><section class="panel hidden" id="game"><div class="stats"><div class="stat"><b id="score">0</b><span>SKOR</span></div><div class="stat"><b id="correct">0</b><span>BENAR</span></div><div class="stat"><b id="wrong">0</b><span>SALAH</span></div><div class="stat"><b id="time">50</b><span>DETIK</span></div></div><div class="question" id="question">—</div><input class="answer" id="answer" type="number" inputmode="numeric" autocomplete="off" placeholder="Jawaban"><button class="btn" id="submit">JAWAB</button><div class="feedback" id="feedback"></div></section><section class="panel result hidden" id="result"><h2 id="resultTitle">Level selesai! 🏆</h2><strong id="finalScore">0</strong><p class="small" id="summary"></p><button class="btn" id="again">MAIN LAGI</button></section></main><script src="js/defeat.js"></script><script>
const setup=document.getElementById('setup'),game=document.getElementById('game'),result=document.getElementById('result'),levelEl=document.getElementById('level'),startBtn=document.getElementById('startBtn'),answer=document.getElementById('answer'),question=document.getElementById('question'),scoreEl=document.getElementById('score'),correctEl=document.getElementById('correct'),wrongEl=document.getElementById('wrong'),timeEl=document.getElementById('time'),feedback=document.getElementById('feedback'),finalScore=document.getElementById('finalScore'),summary=document.getElementById('summary'),resultTitle=document.getElementById('resultTitle');let score=0,correct=0,wrong=0,time=50,current=0,qNo=0,timer=null,level=1;
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function newQuestion(){let a,b,op,ans;const l=level;if(l<=2){a=rand(5,l===1?30:60);b=rand(1,l===1?30:60);op=Math.random()<.5?'+':'−';ans=op==='+'?a+b:a-b}else if(l===3){a=rand(2,15);b=rand(2,12);op='×';ans=a*b}else if(l===4){a=rand(2,15);b=rand(2,12);if(Math.random()<.5){op='×';ans=a*b}else{op='÷';ans=a*b;b=ans}}else{a=rand(l===5?10:20,l===5?80:150);b=rand(2,l===5?15:25);const ops=['+','−','×','÷'];op=ops[rand(0,3)];if(op==='+')ans=a+b;else if(op==='−')ans=a-b;else if(op==='×')ans=a*b;else{ans=a*b;b=ans}}current=ans;question.textContent=`${a} ${op} ${b} = ?`;answer.value='';answer.focus();qNo++}
function start(){clearInterval(timer);level=Number(levelEl.value);score=correct=wrong=qNo=0;time=45+level*5;scoreEl.textContent=0;correctEl.textContent=0;wrongEl.textContent=0;timeEl.textContent=time;feedback.textContent='';setup.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');newQuestion();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)lose('Waktu habis sebelum 10 soal selesai 😹')},1000)}
function submit(){if(time<=0)return;const value=Number(answer.value);if(answer.value.trim()==='')return;if(value===current){const points=10+level*3;score+=points;correct++;feedback.textContent='✓ Benar! +'+points;feedback.style.color='#65e7d0'}else{wrong++;feedback.textContent='✕ Salah';feedback.style.color='#ef7b8a'}scoreEl.textContent=score;correctEl.textContent=correct;wrongEl.textContent=wrong;if(wrong>=3){lose('Tiga jawaban salah. Kucingnya tertawa melihat jawabanmu 😹');return}if(correct>=10){finish();return}newQuestion()}
function lose(msg){clearInterval(timer);game.classList.add('hidden');result.classList.remove('hidden');resultTitle.textContent='KAMU KALAH 😹';finalScore.textContent=score;summary.textContent=`Level ${level} • Benar ${correct} • Salah ${wrong}`;showCatDefeat(msg)}
function finish(){clearInterval(timer);game.classList.add('hidden');result.classList.remove('hidden');resultTitle.textContent='LEVEL SELESAI! 🏆';finalScore.textContent=score;summary.textContent=`Level ${level} selesai dengan ${correct} jawaban benar.`}
startBtn.onclick=start;document.getElementById('submit').onclick=submit;answer.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});document.getElementById('again').onclick=()=>{result.classList.add('hidden');setup.classList.remove('hidden')};
</script></body></html>
