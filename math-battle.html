<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Battle - Nusantara Game Center</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#071522;color:#eefcff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}.wrap{width:min(620px,100%);text-align:center}.back{color:#70e8d8;text-decoration:none;font-weight:800;font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#70e8d8;font-weight:800;margin-top:22px}h1{font-size:clamp(30px,7vw,52px);margin:8px 0}.desc{color:#9db7c1;line-height:1.6}.panel{margin-top:24px;padding:24px;border:1px solid #ffffff18;border-radius:24px;background:#102333e8;box-shadow:0 18px 45px #0005}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{padding:12px;border-radius:14px;background:#ffffff08}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:#9db7c1}.question{font-size:42px;font-weight:1000;margin:22px 0}.answer{width:100%;padding:15px;border-radius:14px;border:1px solid #ffffff20;background:#071522;color:#fff;font-size:24px;text-align:center;outline:none}.btn{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:#65e7d0;color:#071522;font-weight:1000;cursor:pointer}.feedback{height:24px;margin-top:12px;font-weight:800}.start{display:flex;gap:10px}.start select{flex:1;padding:13px;border-radius:12px;background:#071522;color:#fff;border:1px solid #ffffff20}.hidden{display:none}.result h2{font-size:28px}.result strong{font-size:44px}.small{color:#9db7c1;font-size:12px}@media(max-width:500px){.panel{padding:18px}.question{font-size:36px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Kembali pilih game</a><div class="eyebrow">NUSANTARA GAME CENTER</div><h1>🧮 Math Battle</h1><p class="desc">Jawab soal matematika secepat mungkin. Semakin cepat dan benar, semakin tinggi skor.</p><section class="panel" id="setup"><h2>Pilih Kesulitan</h2><div class="start"><select id="difficulty"><option value="easy">Mudah · + −</option><option value="medium">Menengah · × ÷</option><option value="hard">Sulit · campuran</option></select><button class="btn" id="startBtn">MULAI</button></div></section><section class="panel hidden" id="game"><div class="stats"><div class="stat"><b id="score">0</b><span>SKOR</span></div><div class="stat"><b id="streak">0</b><span>STREAK</span></div><div class="stat"><b id="time">60</b><span>DETIK</span></div></div><div class="question" id="question">—</div><input class="answer" id="answer" type="number" inputmode="numeric" autocomplete="off" placeholder="Jawaban"><button class="btn" id="submit">JAWAB</button><div class="feedback" id="feedback"></div></section><section class="panel result hidden" id="result"><h2>Waktu Habis! ⏱️</h2><strong id="finalScore">0</strong><p class="small" id="summary"></p><button class="btn" id="again">MAIN LAGI</button></section></main><script>const setup=document.getElementById('setup'),game=document.getElementById('game'),result=document.getElementById('result'),difficulty=document.getElementById('difficulty'),startBtn=document.getElementById('startBtn'),answer=document.getElementById('answer'),question=document.getElementById('question'),scoreEl=document.getElementById('score'),streakEl=document.getElementById('streak'),timeEl=document.getElementById('time'),feedback=document.getElementById('feedback'),finalScore=document.getElementById('finalScore'),summary=document.getElementById('summary');let score=0,streak=0,time=60,current=0,timer=null,total=0;function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function newQuestion(){const d=difficulty.value;let a,b,op,ans;if(d==='easy'){a=rand(1,30);b=rand(1,30);op=Math.random()<.5?'+':'-';if(op==='-'&&b>a)[a,b]=[b,a]}else if(d==='medium'){a=rand(2,12);b=rand(2,12);if(Math.random()<.5){op='×';ans=a*b}else{op='÷';ans=a*b;b=ans}}else{a=rand(2,30);b=rand(2,12);const ops=['+','−','×','÷'];op=ops[rand(0,3)];if(op==='÷')b=rand(2,10)}if(ans===undefined){if(op==='+')ans=a+b;else if(op==='−')ans=a-b;else if(op==='×')ans=a*b;else ans=Math.floor(a/b)}current=ans;question.textContent=`${a} ${op} ${b} = ?`;answer.value='';answer.focus();total++}function start(){clearInterval(timer);score=0;streak=0;time=60;total=0;scoreEl.textContent=0;streakEl.textContent=0;timeEl.textContent=60;feedback.textContent='';setup.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');newQuestion();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}function submit(){if(time<=0)return;const value=Number(answer.value);if(answer.value.trim()==='')return;if(value===current){const points=10+Math.min(streak,10)*2;score+=points;streak++;feedback.textContent='✓ Benar! +'+points;feedback.style.color='#65e7d0'}else{streak=0;feedback.textContent='✕ Salah';feedback.style.color='#ef7b8a'}scoreEl.textContent=score;streakEl.textContent=streak;newQuestion()}function finish(){clearInterval(timer);game.classList.add('hidden');result.classList.remove('hidden');finalScore.textContent=score;summary.textContent=`Kamu menjawab ${total} soal. Streak terakhir: ${streak}.`}startBtn.onclick=start;document.getElementById('submit').onclick=submit;answer.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});document.getElementById('again').onclick=()=>{result.classList.add('hidden');setup.classList.remove('hidden')};</script></body></html>
