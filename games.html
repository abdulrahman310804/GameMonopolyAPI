<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nusantara Game Center</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#071522;color:#eefcff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,100%);text-align:center}.back{display:inline-block;color:#70e8d8;text-decoration:none;font-weight:800;font-size:13px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#70e8d8;font-weight:800}h1{font-size:clamp(30px,6vw,52px);margin:8px 0}.desc{color:#9db7c1;line-height:1.6}.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}.mode{display:block;text-decoration:none;color:inherit;text-align:left;padding:26px;border:1px solid #ffffff18;border-radius:24px;background:#102333e8;box-shadow:0 18px 45px #0005;transition:.2s}.mode:hover{transform:translateY(-5px);border-color:#65e7d066}.mode-icon{font-size:46px;margin-bottom:16px}.mode h2{margin:0 0 8px;font-size:22px}.mode p{margin:0;color:#9db7c1;font-size:13px;line-height:1.6}.go{display:block;margin-top:20px;color:#65e7d0;font-weight:900;font-size:12px}.game{margin-top:30px;padding:28px;border:1px solid #ffffff18;border-radius:24px;background:#102333e8;box-shadow:0 18px 45px #0005}.picture{font-size:clamp(58px,12vw,105px);padding:28px;min-height:150px;display:grid;place-items:center}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.score{padding:10px;border:1px solid #ffffff18;border-radius:12px}.score.active{border-color:#65e7d0}.score b{display:block}.score span{display:block;color:#ffd478;font-size:20px;font-weight:900}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:650px;margin:auto}.answers button,.actions button{border:1px solid #ffffff22;border-radius:11px;padding:13px;background:#173044;color:#eefcff;font-weight:800;cursor:pointer}.answers button:hover,.actions button:hover{border-color:#65e7d0}.primary{background:#65e7d0!important;color:#06251f!important}.message{min-height:24px;color:#ffd478;font-weight:800;margin:18px}.hidden{display:none}@media(max-width:650px){.modes{grid-template-columns:1fr}.scores{grid-template-columns:1fr 1fr}.answers{grid-template-columns:1fr}.game{padding:20px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Kembali pilih game</a><div class="eyebrow">NUSANTARA GAME CENTER</div><h1 id="title"></h1><p class="desc" id="desc"></p><section id="content"></section></main><script>
const p=new URLSearchParams(location.search), game=p.get('game'), mode=p.get('mode'), level=p.get('level'), content=document.getElementById('content');
const info={monopoly:{title:'🎩 Monopoli Indonesia',desc:'Pilih mode permainan sebelum masuk ke arena.'},'tebak-gambar':{title:'🖼️ Tebak Gambar',desc:'Pilih mode permainan terlebih dahulu, lalu pilih level.'}};
if(!game){
 document.getElementById('title').textContent='🎮 Pilih Permainan';
 document.getElementById('desc').textContent='Pilih game yang ingin dimainkan.';
 content.innerHTML='<div class="modes"><a class="mode" href="games.html?game=monopoly"><div class="mode-icon">🎩</div><h2>Monopoli Indonesia</h2><p>Bangun properti, kelola uang, dan kuasai papan.</p><span class="go">PILIH GAME →</span></a><a class="mode" href="chess.html"><div class="mode-icon">♟</div><h2>Catur</h2><p>Permainan strategi 2 pemain.</p><span class="go">MAIN →</span></a><a class="mode" href="blocks.html"><div class="mode-icon">🧱</div><h2>Susun Balok</h2><p>Game puzzle yang dioptimalkan untuk sentuhan Android.</p><span class="go">MAIN →</span></a><a class="mode" href="games.html?game=tebak-gambar"><div class="mode-icon">🖼️</div><h2>Tebak Gambar</h2><p>Tebak gambar dengan sistem level.</p><span class="go">PILIH GAME →</span></a></div>';
}else{
 const i=info[game]||info.monopoly;document.getElementById('title').textContent=i.title;document.getElementById('desc').textContent=i.desc;
 if(game==='monopoly'&&!mode){
   content.innerHTML='<div class="modes"><a class="mode" href="monopoly.html?mode=local"><div class="mode-icon">👥</div><h2>Bersama Teman</h2><p>2–4 pemain bergantian menggunakan satu perangkat.</p><span class="go">PILIH MODE →</span></a><a class="mode" href="monopoly.html?mode=ai"><div class="mode-icon">🤖</div><h2>Lawan Komputer</h2><p>Pemain lainnya dikendalikan komputer.</p><span class="go">PILIH MODE →</span></a></div>';
 }else if(game==='tebak-gambar'&&!mode){
   content.innerHTML='<div class="modes"><a class="mode" href="games.html?game=tebak-gambar&mode=local"><div class="mode-icon">👥</div><h2>Bersama Teman</h2><p>2–4 pemain bergantian.</p><span class="go">PILIH MODE →</span></a><a class="mode" href="games.html?game=tebak-gambar&mode=ai"><div class="mode-icon">🤖</div><h2>Lawan Komputer</h2><p>1 pemain melawan komputer.</p><span class="go">PILIH MODE →</span></a></div>';
 }else if(game==='tebak-gambar'&&!level){
   content.innerHTML='<div class="modes">'+[1,2,3,4,5,6].map(n=>'<a class="mode" href="games.html?game=tebak-gambar&mode='+mode+'&level='+n+'"><div class="mode-icon">⭐</div><h2>Level '+n+'</h2><p>'+(['Pemula','Mudah','Menengah','Sulit','Ahli','Master'][n-1])+' • 10 soal</p><span class="go">MAIN LEVEL →</span></a>').join('')+'</div>';
 }else if(game==='tebak-gambar'){
   const bank=[
    [['🌧️ + ☂️','Payung',['Payung','Pelangi','Hujan','Jas Hujan']],['🌞 + 🌻','Bunga Matahari',['Bunga Mawar','Matahari Terbit','Bunga Matahari','Bunga Teratai']],['📚 + 🏫','Sekolah',['Perpustakaan','Sekolah','Kampus','Kantor']],['🌊 + 🏝️','Pantai',['Gunung','Pantai','Danau','Sungai']],['🚲 + 🛣️','Bersepeda',['Berkendara','Bersepeda','Berjalan','Balapan']],['🔥 + 🐟','Ikan Bakar',['Ikan Asap','Ikan Bakar','Ikan Goreng','Ikan Api']]],
    [['⭐ + 🐟','Bintang Laut',['Ikan Mas','Bintang Laut','Ikan Terbang','Bintang Ikan']],['🍎 + 📱','Apple',['Android','Apple','Samsung','Nokia']],['🚗 + 🏠','Garasi',['Garasi','Terminal','Parkiran','Bengkel']],['🍚 + 🐔','Nasi Ayam',['Nasi Goreng','Ayam Bakar','Nasi Ayam','Bubur Ayam']],['👑 + 🦁','Raja Hutan',['Raja Hutan','Singa Laut','Kepala Negara','Hewan Buas']],['🌙 + ⭐','Malam',['Pagi','Siang','Malam','Senja']]],
    [['☀️ + 👓','Kacamata Hitam',['Kacamata Hitam','Matahari','Kaca Pembesar','Topi']],['🐱 + 🐟','Kucing Makan Ikan',['Kucing Tidur','Kucing Makan Ikan','Ikan Kucing','Kucing Laut']],['🌧️ + 🌈','Pelangi',['Hujan','Pelangi','Awan','Petir']],['🏠 + 🔥','Kebakaran',['Rumah Baru','Kebakaran','Api Unggun','Dapur']],['📱 + 💻','Teknologi',['Teknologi','Internet','Komputer','Elektronik']]],
    [['🧊 + 🍵','Es Teh',['Teh Panas','Es Teh','Jus','Susu']],['🐝 + 🍯','Madu',['Lebah','Madu','Gula','Manisan']],['🚀 + 🌙','Bulan',['Pesawat','Bulan','Roket','Astronaut']]],
    [['🎂 + 🎉','Ulang Tahun',['Pernikahan','Ulang Tahun','Wisuda','Liburan']],['⚽ + 🥅','Sepak Bola',['Basket','Sepak Bola','Futsal','Tenis']]],
    [['🧠 + 💡','Ide Cemerlang',['Ide Cemerlang','Belajar','Pintar','Lampu']]]];
   let questions=bank[Math.min(6,Math.max(1,+level))-1]||bank[0];let players=mode==='ai'?[{name:'Kamu',score:0},{name:'Komputer',score:0,ai:true}]:[1,2,3,4].map(n=>({name:'Pemain '+n,score:0}));let q=0,turn=0,locked=false;
   content.innerHTML='<div class="scores" id="scores"></div><div class="game"><div id="round" class="eyebrow"></div><div id="picture" class="picture"></div><div>Pilih jawaban yang paling sesuai.</div><div id="answers" class="answers"></div><div id="message" class="message"></div><div class="actions"><button id="next" class="primary hidden">Soal Berikutnya →</button><a class="go" href="games.html?game=tebak-gambar&mode='+mode+'">← Pilih Level</a></div></div>';
   const $=id=>document.getElementById(id);function scores(){$('scores').innerHTML=players.map((x,i)=>'<div class="score '+(i===turn?'active':'')+'"><b>'+x.name+(x.ai?' 🤖':'')+'</b><span>'+x.score+'</span></div>').join('')}
   function question(){locked=false;$('round').textContent='LEVEL '+level+' • SOAL '+(q+1)+' / '+questions.length+' • '+players[turn].name.toUpperCase();$('picture').textContent=questions[q][0];$('message').textContent='';$('next').classList.add('hidden');$('answers').innerHTML=questions[q][2].map((x,i)=>'<button data-a="'+x.replace(/"/g,'&quot;')+'">'+String.fromCharCode(65+i)+'. '+x+'</button>').join('');$('answers').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.a));if(players[turn].ai)setTimeout(ai,700)}
   function answer(v){if(locked)return;locked=true;if(v===questions[q][1]){players[turn].score+=10;$('message').textContent='✅ Benar! +10 poin.'}else $('message').textContent='❌ Jawaban: '+questions[q][1];$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').classList.remove('hidden');scores()}
   function ai(){if(locked)return;const o=questions[q][2];answer(Math.random()<.65?questions[q][1]:o[Math.floor(Math.random()*o.length)])}
   function next(){if(!locked)return;if(q===questions.length-1){$('round').textContent='LEVEL '+level+' SELESAI';$('picture').textContent='🏆';$('answers').innerHTML='';$('message').textContent=players.map(x=>x.name+': '+x.score+' poin').join(' • ');$('next').textContent='Main Lagi';$('next').onclick=()=>location.reload();return}q++;turn=(turn+1)%players.length;question();scores()}$('next').onclick=next;scores();question();
 }
}
</script></body></html>
