<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nusantara Game Center</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#071522;color:#eefcff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(900px,100%);text-align:center}.back{display:inline-block;color:#70e8d8;text-decoration:none;font-weight:800;font-size:13px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#70e8d8;font-weight:800}h1{font-size:clamp(30px,6vw,52px);margin:8px 0}.desc{color:#9db7c1;line-height:1.6}.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}.mode{display:block;text-decoration:none;color:inherit;text-align:left;padding:26px;border:1px solid #ffffff18;border-radius:24px;background:#102333e8;box-shadow:0 18px 45px #0005;transition:.2s}.mode:hover{transform:translateY(-5px);border-color:#65e7d066}.mode-icon{font-size:46px;margin-bottom:16px}.mode h2{margin:0 0 8px;font-size:22px}.mode p{margin:0;color:#9db7c1;font-size:13px;line-height:1.6}.go{display:block;margin-top:20px;color:#65e7d0;font-weight:900;font-size:12px}@media(max-width:650px){.modes{grid-template-columns:1fr}.mode{padding:20px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Kembali pilih game</a><div class="eyebrow">NUSANTARA GAME CENTER</div><h1 id="title"></h1><p class="desc" id="desc"></p><section class="modes" id="content"></section></main><script>const p=new URLSearchParams(location.search),game=p.get('game'),content=document.getElementById('content'),title=document.getElementById('title'),desc=document.getElementById('desc');const card=(icon,name,text,href,label)=>'<a class="mode" href="'+href+'"><div class="mode-icon">'+icon+'</div><h2>'+name+'</h2><p>'+text+'</p><span class="go">'+label+' →</span></a>';if(game==='monopoly'){title.textContent='🎩 Monopoli Indonesia';desc.textContent='Game sudah dipilih. Sekarang pilih cara bermain.';content.innerHTML=card('👥','Bersama Teman','2–4 pemain bergantian menggunakan satu perangkat.','monopoly.html?mode=local','MAIN BERSAMA TEMAN')+card('🤖','Lawan Komputer','Kamu bermain melawan pemain yang dikendalikan komputer.','monopoly.html?mode=ai','LAWAN KOMPUTER')}else if(game==='chess'){title.textContent='♟ Catur';desc.textContent='Game sudah dipilih. Sekarang pilih lawan.';content.innerHTML=card('👥','2 Pemain','Bermain bergantian bersama teman pada satu perangkat.','chess.html?mode=local','MAIN 2 PEMAIN')+card('🤖','Lawan Komputer','Kamu bermain sebagai Putih melawan komputer.','chess.html?mode=ai','LAWAN KOMPUTER')}else if(game==='tebak-gambar'){title.textContent='🖼️ Tebak Gambar';desc.textContent='Pilih level. Game ini khusus untuk 1 pemain.';const labels=['Pemula','Mudah','Menengah','Sulit','Ahli','Master'];content.innerHTML=[1,2,3,4,5,6].map(n=>card('⭐','Level '+n,labels[n-1]+' • 10 soal','tebak-gambar.html?level='+n,'MAIN LEVEL')).join('')}else{location.href='index.html'}</script></body></html>
