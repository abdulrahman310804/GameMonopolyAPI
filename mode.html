<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilih Mode • Nusantara Game Center</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#071522;color:#eefcff;font-family:Inter,system-ui,sans-serif}
.wrap{width:min(760px,100%);text-align:center}.back{display:inline-block;color:#70e8d8;text-decoration:none;font-weight:800;font-size:13px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#70e8d8;font-weight:800}
h1{font-size:clamp(30px,6vw,52px);margin:8px 0}.desc{color:#9db7c1;line-height:1.6}.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.mode{display:block;text-decoration:none;color:inherit;text-align:left;padding:26px;border:1px solid #ffffff18;border-radius:24px;background:#102333e8;box-shadow:0 18px 45px #0005;transition:.2s}.mode:hover{transform:translateY(-5px);border-color:#65e7d066}.mode-icon{font-size:46px;margin-bottom:16px}.mode h2{margin:0 0 8px;font-size:22px}.mode p{margin:0;color:#9db7c1;font-size:13px;line-height:1.6}.go{display:block;margin-top:20px;color:#65e7d0;font-weight:900;font-size:12px}
@media(max-width:600px){body{padding:16px}.modes{grid-template-columns:1fr}.mode{padding:20px}}
</style></head>
<body><main class="wrap"><a class="back" href="index.html">← Kembali pilih game</a><div class="eyebrow" id="eyebrow">NUSANTARA GAME CENTER</div><h1 id="title">Pilih Mode</h1><p class="desc" id="desc">Pilih cara bermain sebelum masuk ke arena.</p>
<section class="modes" id="modes"></section></main>
<script>
const game=new URLSearchParams(location.search).get('game')||'monopoly';
const data={
monopoly:{title:'Monopoli Indonesia',icon:'🎩',desc:'Game sudah dipilih. Sekarang tentukan apakah bermain bersama teman di satu perangkat atau melawan komputer.'},
'tebak-gambar':{title:'Tebak Gambar',icon:'🖼️',desc:'Pilih mode permainan. Pada mode komputer, lawan akan mengambil giliran secara otomatis.'}
};
const g=data[game]||data.monopoly;document.title='Pilih Mode • '+g.title;document.getElementById('title').textContent=g.icon+' '+g.title;document.getElementById('desc').textContent=g.desc;
const modes=document.getElementById('modes');
if(game==='tebak-gambar')modes.innerHTML='<a class="mode" href="tebak-gambar.html?mode=local"><div class="mode-icon">👥</div><h2>Bersama Teman</h2><p>2–4 pemain bergantian pada perangkat yang sama.</p><span class="go">PILIH MODE →</span></a><a class="mode" href="tebak-gambar.html?mode=ai"><div class="mode-icon">🤖</div><h2>Lawan Komputer</h2><p>1 pemain melawan komputer yang mengambil giliran otomatis.</p><span class="go">PILIH MODE →</span></a>';
else modes.innerHTML='<a class="mode" href="monopoly.html?mode=local"><div class="mode-icon">👥</div><h2>Bersama Teman</h2><p>2–4 pemain bergantian menggunakan satu perangkat.</p><span class="go">PILIH MODE →</span></a><a class="mode" href="monopoly.html?mode=ai"><div class="mode-icon">🤖</div><h2>Lawan Komputer</h2><p>Anda bermain sebagai pemain pertama, pemain lainnya dikendalikan komputer.</p><span class="go">PILIH MODE →</span></a>';
</script></body></html>
